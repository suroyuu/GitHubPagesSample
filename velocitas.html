<style>
/* Layout: 16:9 arcade screen in a navy cabinet bezel, one control pad per player under it. Single committed dark look. */
:root{

  --jp:"M PLUS 1","Hiragino Sans","Noto Sans JP",sans-serif;
  --px:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--cab);color:var(--ink);font-family:var(--jp);-webkit-user-select:none;user-select:none}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top,.pad,.screen{width:min(100%,960px,calc((100dvh - 210px) * 16 / 9));min-width:min(100%,320px)}

.keys{font-size:13px;color:var(--mute);display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
.keys b{font-family:var(--px);font-size:15px;font-weight:700;font-style:italic}
.snd{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:2px solid var(--edge);border-radius:6px;padding:4px 10px;cursor:pointer}
.snd:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{aspect-ratio:16/9;max-width:100%;background:var(--bezel);border:6px solid var(--bezel);border-radius:10px;box-shadow:0 0 0 2px var(--edge),0 18px 40px rgba(0,0,0,.45);overflow:hidden;box-sizing:border-box}
canvas{display:block;width:100%;height:100%;touch-action:none}
.pad{display:grid;gap:10px;grid-template-columns:repeat(var(--n,1),minmax(0,1fr))}
.grp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.pad.multi .grp{grid-template-columns:auto repeat(3,minmax(0,1fr));background:#0d1430;border:2px solid var(--edge);border-radius:12px;padding:6px;gap:6px}
.pl{font-family:var(--px);font-style:italic;font-weight:700;font-size:17px;display:grid;place-items:center;padding:0 4px;min-width:26px}
.btn{font:inherit;color:var(--ink);background:#0d1430;border:2px solid var(--edge);border-radius:14px;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:none;min-height:64px;min-width:0}
.pad.multi .btn{border:0;background:transparent;padding:4px 0;min-height:52px}
.cap{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--px);font-style:italic;font-weight:700;font-size:22px;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.3),0 3px 0 rgba(0,0,0,.4);transition:transform .05s}
.pad.multi .cap{width:40px;height:40px;font-size:18px}
.btn[data-b="A"] .cap{background:var(--red)}
.btn[data-b="B"] .cap{background:var(--blue)}
.btn[data-b="C"] .cap{background:var(--gold);color:#1b1f3b}
.btn.on .cap{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.lbl{font-size:14px;color:var(--mute);line-height:1.2}
.pad.multi .lbl{display:none}
@media (max-width:700px){.pad.multi{grid-template-columns:repeat(min(var(--n),2),minmax(0,1fr))}}
@media (max-width:520px){.cap{width:38px;height:38px;font-size:18px}.lbl{font-size:12px}.btn{gap:6px}.pad.multi .cap{width:34px;height:34px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.cap{transition:none}}

<script>
(()=>{
const W=960,H=540;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const JP='"M PLUS 1","Hiragino Sans","Noto Sans JP",sans-serif';
const PX='"Barlow Condensed","Arial Narrow",sans-serif';
const C={gold:'#ffd23f',ink:'#f4f1e6',navy:'#141c3f',deep:'#0b1230',red:'#e8412c',blue:'#2f6fe0',track:'#c4512f',grass:'#3f9a4a',mute:'#97a3d1'};
const PCOL=['#ffd23f','#4fd1ff','#ff7ab8','#7dff7a'];
/* 人数ごとのキー配置。隣の人と手が重ならないよう、段と左右を離してある */
const LAYOUT={
 1:[['KeyZ','KeyX','KeyC']],
 2:[['KeyZ','KeyX','KeyC'],['Comma','Period','Slash']],
 3:[['KeyZ','KeyX','KeyC'],['Digit5','Digit6','Digit7'],['Comma','Period','Slash']],
 4:[['KeyZ','KeyX','KeyC'],['Digit3','Digit4','Digit5'],['Digit9','Digit0','Minus'],['Comma','Period','Slash']],
};
const KLABEL=code=>({Comma:',',Period:'.',Slash:'/',Minus:'-',Equal:'^',BracketLeft:'@',BracketRight:'[',Semicolon:';',Quote:':',Backslash:'\\',IntlRo:'\\',IntlYen:'¥'})[code]||code.replace(/^Key|^Digit/,'');
const keysOf=p=>(LAYOUT[G.nh][p]||[]).map(KLABEL).join(' ');
function resize(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
resize();
/* フォントCSSは media="print" で読み込み、スクリプトの実行を待たせない。
   届いたらここで有効化する。届かなくても代替フォントでゲームは動く。 */
function useFonts(){try{for(const f of ['500 20px "M PLUS 1"','700 20px "M PLUS 1"','800 20px "M PLUS 1"','italic 700 20px "Barlow Condensed"'])document.fonts.load(f).catch(()=>{});}catch(e){}}
(()=>{const el=document.getElementById('fontcss');if(!el){useFonts();return;}
 const on=()=>{if(el.media!=='all'){el.media='all';useFonts();}};
 if(el.sheet)on();else{el.addEventListener('load',on,{once:true});el.addEventListener('error',()=>{},{once:true});setTimeout(on,4000);}})();

/* ---------- 選手と種目 ---------- */
const ATH=[
 {name:'ミナセ・ハヤテ',en:'HAYATE',from:'日本',age:22,spd:10,pow:4,suit:'#e8412c',shorts:'#1b1f3b',skin:'#f0c08a',hair:'#1a1410',style:'疾風のスプリンター'},
 {name:'イングリッド・ホルム',en:'INGRID',from:'ノルウェー',age:25,spd:8,pow:6,suit:'#2f6fe0',shorts:'#f4f1e6',skin:'#f7d9bf',hair:'#f2cf5b',tail:true,style:'北国のオールラウンダー'},
 {name:'ブルーノ・カルデラ',en:'BRUNO',from:'ブラジル',age:29,spd:7,pow:7,suit:'#15a05a',shorts:'#ffd23f',skin:'#a86f45',hair:'#2a1a0c',style:'陽気な万能アスリート'},
 {name:'ビョルン・ストール',en:'BJORN',from:'アイスランド',age:34,spd:3,pow:10,suit:'#7a3fc4',shorts:'#1b1f3b',skin:'#f1cdb0',hair:'#c4532c',beard:true,style:'火山育ちの剛腕'},
 {name:'アマラ・オコロ',en:'AMARA',from:'ナイジェリア',age:23,spd:9,pow:5,suit:'#ff8a1f',shorts:'#1b1f3b',skin:'#6b4226',hair:'#151010',hs:'afro',style:'爆速の新星'},
 {name:'ナディア・ベンサラ',en:'NADIA',from:'モロッコ',age:27,spd:8,pow:5,suit:'#11a3a3',shorts:'#f4f1e6',skin:'#c99266',hair:'#2a1a0c',hs:'bun',style:'砂丘で鍛えた脚力'},
 {name:'ルカ・ペトロヴィチ',en:'LUKA',from:'セルビア',age:31,spd:6,pow:8,suit:'#e2559b',shorts:'#1b1f3b',skin:'#f2cfae',hair:'#3b2a1e',hs:'mohawk',style:'パンクな万能型'},
 {name:'タネ・ハウイティ',en:'TANE',from:'ニュージーランド',age:30,spd:5,pow:9,suit:'#2b3340',shorts:'#f4f1e6',skin:'#9a6a46',hair:'#151010',hs:'bald',beard:true,style:'大地を揺らす怪力'},
 {name:'エミリオ・ヴァルガス',en:'EMILIO',from:'メキシコ',age:28,spd:6,pow:9,suit:'#c9962b',shorts:'#1b1f3b',skin:'#b07a4f',hair:'#1a1410',hs:'band',band:'#e8412c',style:'豪快なルチャ魂'},
 {name:'サーガ・リンドクヴィスト',en:'SAGA',from:'スウェーデン',age:26,spd:9,pow:4,suit:'#4fb3e8',shorts:'#ffd23f',skin:'#f7dcc4',hair:'#e8d07a',hs:'long',style:'氷原の流星'},
 {name:'カイ・マカナニ',en:'KAI',from:'アメリカ',age:24,spd:7,pow:6,suit:'#ff6f61',shorts:'#f4f1e6',skin:'#b9845a',hair:'#2a1a0c',hs:'curly',style:'ハワイの波乗り'},
 {name:'ラヒム・チョードリー',en:'RAHIM',from:'バングラデシュ',age:22,spd:10,pow:3,suit:'#006a4e',shorts:'#e8412c',skin:'#a87750',hair:'#151010',style:'しなやかな俊足'},
 {name:'ヨナス・ケラー',en:'JONAS',from:'スイス',age:33,spd:4,pow:9,suit:'#9b1d20',shorts:'#f4f1e6',skin:'#f3d3b5',hair:'#6b4a2a',beard:true,style:'山岳の重戦車'},
 {name:'ミラ・コヴァーチ',en:'MIRA',from:'ハンガリー',age:21,spd:6,pow:7,suit:'#f29ac0',shorts:'#1b1f3b',skin:'#f6d8bf',hair:'#7a3b1c',tail:true,style:'空中の芸術家'},
 {name:'ウィル・アサンテ',en:'WILL',from:'ガーナ',age:29,spd:5,pow:8,suit:'#f4c430',shorts:'#1b1f3b',skin:'#5a3a22',hair:'#151010',style:'王者の風格'},
 {name:'イ・ハユン',en:'HAYUN',from:'韓国',age:25,spd:8,pow:7,suit:'#e9edf2',shorts:'#2f6fe0',skin:'#f2d2b6',hair:'#151010',hs:'long',style:'冷静な戦術家'},
];
ATH.forEach(a=>{a.s5=a.spd/2;a.p5=a.pow/2;});
const NA=ATH.length;
const EV={
 dash:{name:'100m ダッシュ',type:'lane',better:'low',how:['A・B を交互に連打して走れ','同じボタンの連打は伸びが悪い']},
 shot:{name:'ロケット砲丸投げ',type:'turn',better:'high',how:['A・B 連打でパワーをためる','角度の針を見て C で投てき（45°が理想）']},
 longjump:{name:'スーパー幅跳び',type:'lane',better:'high',how:['A・B 連打で助走する','踏み切り板の手前で C ジャンプ。越えるとファウル']},
 break:{name:'岩盤割り',type:'turn',better:'high',how:['5秒間 A・B 連打で「気」をためる','動くゲージの中心で C を押して手刀']},
 hurdle:{name:'110m 雷鳴ハードル',type:'lane',better:'low',how:['A・B 連打で走り、ハードル手前で C ジャンプ','引っかかると大きく失速する']},
 lift:{name:'自動車リフト',type:'turn',better:'high',how:['A・B 連打で車を持ち上げる','頭上まで上がったら C でロック。10秒で何回？']},
 swim:{name:'100m 超人自由形',type:'lane',better:'low',how:['A・B 連打で泳ぐ','酸素が切れる前に C で息つぎ']},
 sky:{name:'スカイダイブ着地',type:'col',better:'low',how:['C でパラシュートを開く','低く開くほど上位。40m 未満で開くと失敗']},
 tire:{name:'50m タイヤ引き',type:'lane',better:'low',how:['A・B 連打で巨大タイヤを引っぱる','パワーが高い選手ほど速い']},
 hand:{name:'50m 逆立ち競走',type:'lane',better:'low',how:['A・B 連打で逆立ち歩き','かたむいたら C で立て直す。倒れると1秒ロス']},
 target:{name:'スカイターゲット',type:'col',better:'high',how:['飛んでくる円盤が緑の線に来たら C','12枚中何枚撃ち落とせるか']},
 pole:{name:'超・棒高跳び',type:'turn',better:'high',how:['A・B 連打で助走する','緑の踏み切りゾーンで C。速いほど高く跳べる']},
 hammer:{name:'ハンマー投げ',type:'turn',better:'high',how:['A・B 連打で回転を上げる','ハンマーが前方の緑に来たら C で投てき']},
 dive:{name:'30m 高飛び込み',type:'turn',better:'high',how:['C で飛び出し、もう一度 C で回転開始','着水前に C で体を伸ばす。頭から入れば高得点']},
};
const FULL=['dash','shot','longjump','break','target','hurdle','hammer','tire','lift','pole','hand','swim','dive','sky'];
const MODES=[['クイック',4],['ノーマル',8],['フル',FULL.length]];

let REC={};
try{REC=JSON.parse(localStorage.getItem('velocitas-rec')||'{}')||{};}catch(e){REC={};}
function saveRec(){try{localStorage.setItem('velocitas-rec',JSON.stringify(REC));}catch(e){}}
function fmt(key,v,dnf){
 if(dnf)return (key==='longjump'||key==='hammer')?'ファウル':(key==='sky'||key==='pole')?'失敗':'記録なし';
 if(['dash','hurdle','swim','tire','hand'].includes(key))return v.toFixed(2)+'秒';
 if(['shot','longjump','hammer','pole'].includes(key))return v.toFixed(2)+'m';
 if(key==='break')return v+'枚';if(key==='lift')return v+'回';if(key==='target')return v+'/12';if(key==='dive')return v.toFixed(1)+'点';
 return '開傘 '+v+'m';
}


/* ---------- サウンド ---------- */
let AC=null,muted=false;
function audioInit(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();else if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d=.06,type='square',vol=.05,slide=0){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function boom(d=.3,vol=.12){if(!AC||muted)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;g.gain.value=vol;s.connect(g).connect(AC.destination);s.start(t);}
function jingle(notes,step=.11){notes.forEach((f,i)=>setTimeout(()=>beep(f,.14,'square',.05),i*step*1000));}

/* ---------- 共通描画 ---------- */
const mod=(a,n)=>((a%n)+n)%n;
function shade(hex,f){const n=parseInt(hex.slice(1),16);return `rgb(${Math.round((n>>16)*f)},${Math.round((n>>8&255)*f)},${Math.round((n&255)*f)})`;}
function txt(s,x,y,size,color,align='left',font=JP,stroke=0){
 const num=font===PX,sz=Math.round(num?size*(size>=40?1.35:1.7):size);
 ctx.font=(num?'italic 700 ':sz>=28?'800 ':sz>=16?'700 ':'500 ')+sz+'px '+font;ctx.textAlign=align;ctx.textBaseline='alphabetic';
 if(stroke){ctx.save();ctx.shadowColor='rgba(5,10,30,.6)';ctx.shadowBlur=Math.max(4,stroke*1.4);ctx.shadowOffsetY=2;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();}
 ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}
function panel(x,y,w,h,fill='rgba(14,22,56,.82)',edge=C.gold){
 ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;ctx.fillStyle=fill;rr(x,y,w,h,14);ctx.fill();ctx.restore();
 ctx.strokeStyle=edge;ctx.globalAlpha=.85;ctx.lineWidth=2;rr(x+1,y+1,w-2,h-2,13);ctx.stroke();ctx.globalAlpha=1;
}
function vbar(x,y,w,h,k,label){panel(x-12,y-14,w+24,h+28);ctx.fillStyle='rgba(255,255,255,.12)';rr(x,y,w,h,w/2);ctx.fill();if(k>0){const hh=Math.max(w,h*k);const g=ctx.createLinearGradient(0,y+h-hh,0,y+h);g.addColorStop(0,k>.8?C.red:C.gold);g.addColorStop(1,k>.8?'#ff9a6a':'#ffe89a');ctx.fillStyle=g;rr(x,y+h-hh,w,hh,w/2);ctx.fill();}txt(label,x+w/2,y-22,14,C.gold,'center',JP,4);}

const CROWD=document.createElement('canvas');CROWD.width=960;CROWD.height=92;
(()=>{const c=CROWD.getContext('2d');c.fillStyle='#232c55';c.fillRect(0,0,960,92);for(let r=0;r<9;r++){c.fillStyle=r%2?'#2a3463':'#1e2750';c.fillRect(0,r*10+2,960,10);}
 const cols=['#e8412c','#ffd23f','#f4f1e6','#2f6fe0','#15a05a','#ff8fb0','#7a3fc4','#ff9a3c'],sk=['#f0c08a','#a86f45','#f7d9bf','#6b4226'];
 for(let r=0;r<8;r++)for(let x=4+(r%2)*5;x<960;x+=10){c.fillStyle=cols[(Math.random()*cols.length)|0];c.beginPath();c.ellipse(x,r*10+11,4,3,0,0,7);c.fill();c.fillStyle=sk[(Math.random()*4)|0];c.beginPath();c.arc(x,r*10+7,3,0,7);c.fill();}})();
const ADS=[['VELOCITAS 2026','#e8412c','#fff'],['超人ドリンク ゴクリ','#ffd23f','#1b1f3b'],['ハヤブサ運動靴','#2f6fe0','#fff'],['カミナリ電機','#f4f1e6','#1b1f3b'],['月面旅行社','#15a05a','#fff'],['ニトロ乳業','#7a3fc4','#fff']];
function drawStadium(off){
 const g=ctx.createLinearGradient(0,0,0,165);g.addColorStop(0,'#2e6fd0');g.addColorStop(1,'#a3d6f2');ctx.fillStyle=g;ctx.fillRect(0,0,W,165);
 ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<5;i++){const x=mod(i*240-off*.05-G.t*10,1200)-120,y=34+(i*37)%80;ctx.beginPath();ctx.ellipse(x,y,46,13,0,0,7);ctx.ellipse(x+30,y-8,30,12,0,0,7);ctx.fill();}
 for(const lx of [70,890]){ctx.fillStyle='#5a6378';ctx.fillRect(lx-2,40,4,112);ctx.fillStyle='#e9eef6';ctx.fillRect(lx-18,30,36,14);}

 ctx.fillStyle=C.deep;ctx.fillRect(0,242,W,30);
 for(let k=0;k<6;k++){const x=mod(k*240-off,1440)-240,a=ADS[k];ctx.fillStyle=a[1];ctx.fillRect(x+3,245,234,24);txt(a[0],x+120,263,15,a[2],'center');}

/* 人物: x,y = 足元。s = 身長px。返り値は前の手の座標 */
function drawFig(x,y,s,a,p,fx=1){
 ctx.save();ctx.translate(x,y);ctx.scale(fx*s/100,s/100);ctx.lineCap='round';ctx.lineJoin='round';
 const lean=p.lean||0,dy=p.dy||0;

function shotUpdate(c,dt){

 else if(c.phase==='flight'){c.k=Math.min(1,c.k+dt*5);const n=4,h=dt*2.3/n;for(let i=0;i<n;i++){const b=c.ball;b.vy-=9.8*h;b.x+=b.vx*h;b.y+=b.vy*h;}

  if(b.x>=c.dist){c.phase='land';c.bs={x:OX+c.dist*FS,y:FGY};boom(.4,.18);G.shake=10;jingle([660,880]);turnDone(c,c.dist,false,2.4);}}
 else if(c.phase==='land'){c.lt+=dt;if(c.trail.length)c.trail.shift();}
}

 const top=SB-NS*SH;

  ctx.fillStyle='#3a3530';ctx.fillRect(SX+4,y+SH-1,8,1);ctx.fillRect(SX+SW-12,y+SH-1,8,1);
  if(!broken){ctx.fillStyle=base;ctx.fillRect(SX,y,SW,SH-1);}
  else{const o=Math.min(14,(c.st-.2)*30);ctx.save();ctx.translate(SX+SW/2-o,y+SH/2);ctx.rotate(-.06);ctx.fillStyle=base;ctx.fillRect(-SW/2,-SH/2,SW/2-2,SH-1);ctx.restore();
   ctx.save();ctx.translate(SX+SW/2+o,y+SH/2);ctx.rotate(.06);ctx.fillStyle=base;ctx.fillRect(2,-SH/2,SW/2-2,SH-1);ctx.restore();}}
 for(const ci of c.order||[]){const v=c.vals&&c.vals[ci];if(!v||ci===c.ci)continue;const y=top+v.val*SH;ctx.fillStyle=colOf(ci);ctx.fillRect(SX+SW+4,y-1,26,3);txt(tagOf(ci),SX+SW+34,y+5,9,colOf(ci),'left',PX,3);}

 if(err<=14){d.st[k]='hit';d.hits++;d.prec+=1-err/14;d.hitT[k]=c.t;if(!d.cpu){boom(.12,.1);beep(1200,.08,'square',.04);}}
 else{d.st[k]='miss';if(!d.cpu)beep(160,.08,'sawtooth',.03);}}

const wrapA=t=>Math.atan2(Math.sin(t),Math.cos(t));

 c.dist=Math.round((35+c.s*1.15*(.72+a.p5*.08))*Math.cos(d*1.2)*100)/100;c.phase='fly';c.fu=0;boom(.3,.12);beep(300,.5,'sawtooth',.04,600);}

function drawHammer(c){

 const a=ATH[c.ath],cx=OX-20,cy=FGY-40,R=74,RY=20,spin=c.phase==='spin',th=c.th;

function finishEvent(rows){
 const key=evKey(),low=EV[key].better==='low';
 rows.sort((a,b)=>(a.dnf?1:0)-(b.dnf?1:0)||(low?a.val-b.val:b.val-a.val)||(b.tb||0)-(a.tb||0));
 G.prevRank=finalOrder();G.gain=[0,0,0,0];
 rows.forEach((r,i)=>{r.rank=i+1;r.pts=PTS[i];G.totals[r.ci]+=PTS[i];G.gain[r.ci]=PTS[i];});
 let recBy=-1;
 for(const r of rows){if(G.comps[r.ci].p<0||r.dnf)continue;const prev=REC[key];if(prev==null||(low?r.val<prev:r.val>prev)){REC[key]=r.val;recBy=r.ci;}}
 if(recBy>=0)saveRec();
 G.res={rows,recBy};go('result');
 if(G.comps[rows[0].ci].p>=0)jingle([523,659,784,1047]);else jingle([440,523,659]);
}

function press(p,b){
 audioInit();lit(p,b);
 const s=G.scene;
 if(s==='title'){go('setup');G.row=0;beep(880,.08);return;}
 if(s==='setup'){
  if(G.row===0){if(b==='A')G.nh=Math.max(1,G.nh-1);else if(b==='B')G.nh=Math.min(4,G.nh+1);else G.row=1;buildPad();}
  else if(G.row===1){if(b==='C')G.row=2;else G.mode=(G.mode+(b==='A'?2:1))%3;}
  else{if(b==='C'){G.picks=[];G.chooser=0;G.sel=0;go('select');jingle([659,880]);return;}G.row=0;}
  beep(600,.04);return;}
 if(s==='select'){
  const step=d=>{let i=G.sel;do{i=(i+d+NA)%NA;}while(G.picks.includes(i));G.sel=i;};
  if(b==='A'){step(-1);beep(600,.04);}else if(b==='B'){step(1);beep(600,.04);}
  else{G.picks.push(G.sel);G.chooser++;jingle([659,880]);if(G.chooser>=G.nh)setupComps();else step(1);}
  return;}
 if(s==='intro'){if(b==='C'&&G.st>.3)startEvent();return;}
 if(s==='play'){const c=G.cur;if(p>=G.nh)return;
  if(EV[c.key].type==='turn'){if(p!==c.p)return;if(c.wait){if(b==='C')turnStart(c);return;}if(c.count>0||c.after>0)return;MOD[c.key].inp(c,b);return;}
  if(c.count>0)return;MOD[c.key].inp(c,p,b);return;}
 if(s==='result'){if(b==='C'&&G.st>.8){if(G.ev<G.evs.length-1){go('standings');beep(880,.08);}else startFinal();}return;}
 if(s==='standings'){if(b==='C'&&G.st>.6){G.ev++;go('intro');beep(880,.08);}return;}
 if(s==='final'){if(b==='C'&&G.st>1.2){go('title');beep(880,.08);}}
}

function update(dt){
 G.t+=dt;G.st+=dt;G.shake=Math.max(0,G.shake-dt*40);
 pollPads();
 if(G.scene==='play'){const c=G.cur,turn=EV[c.key].type==='turn';
  if(turn&&c.wait)return;
  if(turn&&c.after>0){c.after-=dt;MOD[c.key].upd(c,dt);if(c.after<=0)nextTurn(c);return;}
  if(c.count>0){const b=Math.ceil(c.count);c.count-=dt;if(c.count<=0){c.goT=0;beep(880,.3,'square',.06);}else if(Math.ceil(c.count)!==b)beep(440,.12,'square',.05);return;}
  c.goT+=dt;MOD[c.key].upd(c,dt);}
 if(G.scene==='final')for(const q of G.confetti){q.y+=q.v*dt;q.x+=Math.sin(G.t*2+q.r)*20*dt;if(q.y>H+10){q.y=-10;q.x=Math.random()*W;}}
}

/* ループは何があっても止めない。次フレームを先に予約してから更新・描画し、
   例外が出てもループ自体は生き残る。万一止まった場合は見張りタイマーで再開する。 */
let last=performance.now(),alive=last,raf=0;
function loop(now){
 alive=performance.now();
 let dt=(now-last)/1000;last=now;
 if(!isFinite(dt)||dt<0)dt=0;
 raf=requestAnimationFrame(loop);
 try{update(Math.min(.05,dt));draw();}catch(e){console.error('velocitas:',e);}
}
function kick(){if(raf)cancelAnimationFrame(raf);last=alive=performance.now();raf=requestAnimationFrame(loop);}
kick();
setInterval(()=>{if(document.visibilityState!=='hidden'&&performance.now()-alive>1000)kick();},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden')kick();});
window.addEventListener('pageshow',kick);

/* ---------- 入力 ---------- */
/* 1人ならスペース・Enter・矢印も P1。複数人ではメニュー操作だけに使い、競技中は無効 */
const ALIAS={Space:'C',Enter:'C',ArrowUp:'C',ArrowLeft:'A',ArrowRight:'B'};
function keyFor(code){
 for(const [p,codes] of LAYOUT[G.nh].entries()){const j=codes.indexOf(code);if(j>=0)return [p,'ABC'[j]];}
 if(ALIAS[code]&&(G.nh===1||G.scene!=='play'))return [0,ALIAS[code]];
 return null;
}
window.addEventListener('keydown',e=>{const m=keyFor(e.code);if(!m)return;e.preventDefault();if(e.repeat)return;press(m[0],m[1]);});
const padPrev=[];
function pollPads(){let ps;try{ps=navigator.getGamepads?navigator.getGamepads():[];}catch(e){return;}let k=0;
 for(const gp of ps){if(!gp)continue;const p=k++;if(p>3)break;const bs=gp.buttons||[],btn=i=>!!(bs[i]&&bs[i].pressed);const st=[btn(0),btn(1),btn(2)||btn(3)],pr=padPrev[p]||[];
  ['A','B','C'].forEach((b,i)=>{if(st[i]&&!pr[i])press(p,b);});padPrev[p]=st;}}
const padEl=document.getElementById('pad');let btns={};
function buildPad(){
 padEl.innerHTML='';btns={};const multi=G.nh>1;padEl.className='pad'+(multi?' multi':'');padEl.style.setProperty('--n',multi?G.nh:1);
 const labels={A:'連打',B:'連打',C:'ジャンプ<br>投げる・決定'};
 for(let p=0;p<G.nh;p++){const g=document.createElement('div');g.className='grp';
  if(multi){const l=document.createElement('div');l.className='pl';l.textContent='P'+(p+1);l.style.color=PCOL[p];g.appendChild(l);g.style.borderColor=PCOL[p]+'88';}
  for(const b of ['A','B','C']){const el=document.createElement('button');el.type='button';el.className='btn';el.dataset.b=b;el.setAttribute('aria-label',(multi?'P'+(p+1)+' ':'')+b+'ボタン');
   el.innerHTML=`<span class="cap">${b}</span><span class="lbl">${labels[b]}</span>`;
   el.addEventListener('pointerdown',e=>{e.preventDefault();press(p,b);});
   el.addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='Space')e.stopPropagation();});
   el.addEventListener('click',e=>{if(e.detail===0)press(p,b);});
   btns[p+b]=el;g.appendChild(el);}
  padEl.appendChild(g);}
 document.getElementById('keylist').innerHTML=LAYOUT[G.nh].map((_,p)=>`<span><b style="color:${PCOL[p]}">P${p+1}</b> ${keysOf(p)}</span>`).join('');
}
function lit(p,b){const el=btns[p+b];if(!el)return;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),90);}
buildPad();
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(G.scene!=='play')press(0,'C');});
const snd=document.getElementById('snd');
snd.addEventListener('click',()=>{muted=!muted;snd.textContent=muted?'音 OFF':'音 ON';audioInit();});
})();
